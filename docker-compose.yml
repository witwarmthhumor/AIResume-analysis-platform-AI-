# 容器编排清单：docker compose 命令自动读取本文件（文件名是官方约定，不可改）
# 阶段0 只有数据库；后端/前端的容器化在阶段5
services:
  db:
    # v3.0：pgvector 镜像（基于 Postgres 16，自带 vector 扩展）。数据卷与旧镜像兼容，直接换镜像即可
    image: pgvector/pgvector:pg16
    container_name: ai-interview-db
    environment:
      POSTGRES_USER: ai # 本地开发用的账号/密码，仅本机可见，不用于生产
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai_interview
    ports:
      - "127.0.0.1:5432:5432" # 宿主机端口:容器端口，后端通过 localhost:5432 连接
    volumes:
      - pgdata:/var/lib/postgresql/data # 具名卷：容器重建后数据仍在
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_interview"]
      interval: 5s
      timeout: 3s
      retries: 10

  # v3.0 Playground：本地 embedding 模型（OpenAI 兼容 API），backend 通过 localhost:11434 调用
  ollama:
    image: ollama/ollama:latest
    container_name: ai-interview-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama # 模型文件持久化，重建容器不重复下载
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  ollama_data:
