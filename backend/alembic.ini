# Alembic config (official fixed filename).
# NOTE: keep this file ASCII-only. On Chinese Windows, configparser reads it
# with the GBK locale codec, and UTF-8 non-ASCII text crashes it (hit 2026-08-31).
# The DB URL is NOT set here; app/core/config.py injects it from backend/.env.

[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
