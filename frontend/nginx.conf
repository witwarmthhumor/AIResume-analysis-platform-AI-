server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 简历上传后端限 5MB，这里放宽到 6m 留余量——nginx 默认 1MB 会把 1~5MB 的上传直接 413
    client_max_body_size 6m;

    # 安全响应头（HSTS 待启用 HTTPS 后再加）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 前端静态产物压缩（vite 产物以 js/css/json/svg 为主）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location = /api/health/ready {
        proxy_pass http://backend:8000/health/ready;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        # 面试 SSE 是逐段推送的流，必须关缓冲，否则打字机效果被攒成块
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
